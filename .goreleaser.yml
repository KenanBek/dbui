version: 2

project_name: dbui

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: dbui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: KenanBek
    name: dbui
  draft: true
  prerelease: auto

homebrew_casks:
  - name: dbui
    repository:
      owner: KenanBek
      name: homebrew-dbui
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    description: "Terminal UI for MySQL, PostgreSQL, and SQLite."
    homepage: "https://github.com/kenanbek/dbui"
    commit_author:
      name: KenanBek
      email: mail@kenanbek.me
    # dbui binaries are unsigned; strip the quarantine bit so Gatekeeper
    # does not block the cask-installed binary.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dbui"]
          end

nfpms:
  - maintainer: KenanBek
    description: "Terminal UI for MySQL, PostgreSQL, and SQLite."
    homepage: "https://github.com/kenanbek/dbui"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
