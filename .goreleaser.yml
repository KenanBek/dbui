version: 2

project_name: dbui

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: dbui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: KenanBek
    name: dbui
  draft: true
  prerelease: auto

brews:
  - name: dbui
    repository:
      owner: KenanBek
      name: dbui
    directory: Formula
    description: "Terminal UI for MySQL, PostgreSQL, and SQLite."
    homepage: "https://github.com/kenanbek/dbui"
    license: "Apache-2.0"
    commit_author:
      name: KenanBek
      email: mail@kenanbek.me
    install: bin.install "dbui"
    test: |
      system "#{bin}/dbui", "-version"

nfpms:
  - maintainer: KenanBek
    description: "Terminal UI for MySQL, PostgreSQL, and SQLite."
    homepage: "https://github.com/kenanbek/dbui"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
